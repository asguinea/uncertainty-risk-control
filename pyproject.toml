[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "uncertainty-risk-control"
version = "0.1.0.dev0"
description = "Research methods and reproducible studies of selective prediction and risk control"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_SCOPE.md", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Alejandro Sanchez Guinea"}]
dependencies = ["numpy==2.4.6", "scipy==1.17.1"]

[project.urls]
Repository = "https://github.com/asguinea/uncertainty-risk-control"
Issues = "https://github.com/asguinea/uncertainty-risk-control/issues"

[project.scripts]
uqrc = "uncertainty_risk_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uncertainty_risk_control"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/scripts", "/experiments", "/provenance", "/.github", "/.gitattributes", "/.gitignore", "/README.md", "/LICENSE", "/LICENSE_SCOPE.md", "/THIRD_PARTY_NOTICES.md", "/CITATION.cff", "/pyproject.toml", "/uv.lock", "/.python-version"]

[dependency-groups]
figures = [
    "matplotlib==3.10.7",
]
